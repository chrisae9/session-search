<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">How an agent retrieves earlier conversations</title>
<desc id="desc">Read left to right: a coding agent asks through MCP, the search engine finds matching evidence in stored history, and that history comes from captured Codex sessions or historical imports. Excerpts and immutable citations return to the agent. Optional local or remote embeddings support semantic search. In a shared deployment, verified search snapshots replicate from the primary to a read-only replica for search failover.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#94a3b8"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#5eead4"/></marker>
</defs>
