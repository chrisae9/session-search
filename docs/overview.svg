<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
<title id="title">Session Search — capture, remote embeddings, and replication</title>
<desc id="desc">Codex session files and historical imports feed capture and a durable upload queue. Capture writes to a local catalog or uploads to a primary service. The catalog stores canonical evidence and optional raw archives. Coding agents search and expand citations through MCP. Optional local embeddings or a remote embedding server support semantic indexing and queries. A primary can publish verified search snapshots to an optional read-only replica, which can serve search failover. The replica does not accept writes and is not a complete raw-file backup.</desc>
