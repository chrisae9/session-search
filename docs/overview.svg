<g fill="#5eead4" font-size="12" font-weight="600">
<text x="50" y="374">SEARCH ENGINE · OPTIONAL EMBEDDINGS</text><text x="622" y="374">STORED HISTORY · OPTIONAL REPLICATION</text>
</g>
<g fill="#f1f5f9" font-size="17" font-weight="600">
<text x="50" y="402">Local model or remote embedding server</text><text x="622" y="402">Primary and read-only search replica</text>
</g>
<g fill="#cbd5e1" font-size="13">
<text x="50" y="427">Embeds captured evidence and incoming search queries.</text><text x="50" y="450">The engine compares compatible vectors; keyword search</text><text x="50" y="470">continues when embeddings are unavailable.</text>
<text x="622" y="427">Verified snapshots replicate evidence and compatible vectors.</text><text x="622" y="450">The MCP client can retry eligible failures against the replica.</text><text x="622" y="470">No replica writes or promotion; raw-file backups are separate.</text>
</g>
<text x="32" y="514" font-size="12" fill="#94a3b8">Local capture and keyword retrieval require neither an embedding server nor a replica.</text>
</g></svg>
