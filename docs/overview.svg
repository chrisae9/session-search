<g text-anchor="middle" fill="#f1f5f9" font-size="17" font-weight="600">
<text x="130" y="151">Coding agent</text><text x="356" y="151">MCP</text><text x="582" y="151">Search engine</text><text x="808" y="151">Stored history</text><text x="1052" y="151">Session sources</text>
</g>
<g text-anchor="middle" fill="#cbd5e1" font-size="13">
<text x="130" y="179">“What did we decide</text><text x="130" y="199">about retries?”</text><text x="130" y="220">Retrieval skill</text>
<text x="356" y="180">search · context · status</text><text x="356" y="205">Read-only agent tools</text>
<text x="582" y="179">Keyword + optional semantic</text><text x="582" y="200">Project, role, time filters</text><text x="582" y="221">Local or shared service</text>
<text x="808" y="179">SQLite + recorded revisions</text><text x="808" y="200">Evidence and vectors</text><text x="808" y="221">Optional raw archives</text>
<text x="1052" y="179">Codex files · historical imports</text><text x="1052" y="200">Background capture</text><text x="1052" y="221">Queued uploads in shared mode</text>
</g>
