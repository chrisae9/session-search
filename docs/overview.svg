<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="280" viewBox="0 0 1040 280" role="img" aria-labelledby="title desc">
  <title id="title">Session Search — capture and retrieval</title>
  <desc id="desc">Background capture reads Codex session files into a SQLite catalog with optional embeddings. A coding agent queries the catalog through the search, context, and status MCP tools. Results carry citations to immutable conversation revisions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1040" height="280" rx="16" fill="#111827"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="32" y="39" font-size="15" font-weight="600" fill="#e2e8f0">CAPTURE AND RETRIEVAL</text>
    <text x="32" y="65" font-size="13" fill="#94a3b8">Background ingestion</text>
    <text x="812" y="65" font-size="13" fill="#94a3b8">Agent requests</text>
    <g fill="#1e293b" stroke="#475569">
      <rect x="32" y="96" width="164" height="90" rx="10"/>
      <rect x="235" y="96" width="164" height="90" rx="10"/>
      <rect x="438" y="96" width="164" height="90" rx="10" stroke="#5eead4"/>
      <rect x="641" y="96" width="164" height="90" rx="10"/>
      <rect x="844" y="96" width="164" height="90" rx="10"/>
    </g>
    <g stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 198 141 H 227"/>
      <path d="M 401 141 H 430"/>
      <path d="M 639 141 H 610"/>
      <path d="M 842 141 H 813"/>
    </g>
    <g text-anchor="middle" font-size="16" font-weight="600" fill="#f1f5f9">
      <text x="114" y="130">Codex sessions</text>
      <text x="317" y="130">Capture</text>
      <text x="520" y="130">Catalog</text>
      <text x="723" y="130">MCP</text>
      <text x="926" y="130">Coding agent</text>
    </g>
    <g text-anchor="middle" font-size="12" fill="#cbd5e1">
      <text x="114" y="156">JSONL files</text>
      <text x="317" y="156">Scheduled sync</text>
      <text x="520" y="153">SQLite + optional</text>
      <text x="520" y="171">embeddings</text>
      <text x="723" y="153">search · context</text>
      <text x="723" y="171">status</text>
      <text x="926" y="156">Retrieval skill</text>
    </g>
    <path d="M 520 193 V 222 H 926 V 194" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="723" y="252" text-anchor="middle" font-size="13" fill="#5eead4">Excerpts and citations to recorded revisions</text>
  </g>
</svg>
