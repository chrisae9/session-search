<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Session Search architecture</title>
  <desc id="desc">A coding agent searches earlier conversations through MCP and receives excerpts with immutable citations. Session Search queries its SQLite history and index. Each device captures its Codex sessions and queues authenticated uploads to the shared primary, retrying after outages. Agents on connected devices search the combined history. Historical imports can also populate the catalog. An optional local model or remote embedding server embeds evidence and queries. In a shared deployment, the primary publishes verified evidence and vector snapshots to an optional read-only search replica for failover.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#63738a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5069b0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="1" y="1" width="1118" height="618" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="47" font-size="15" font-weight="700" letter-spacing="1.3" fill="#63738a">SESSION SEARCH</text>
    <text x="40" y="86" font-size="27" font-weight="600" fill="#17243a">Agent retrieval, capture, and replication</text>

    <!-- One foreground interaction. -->
    <rect x="40" y="212" width="212" height="144" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <g transform="translate(60 235)" fill="none" stroke="#5069b0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect width="30" height="25" rx="4"/><path d="M7 8 l5 5 -5 5 M17 18 h6"/>
    </g>
    <text x="60" y="289" font-size="21" font-weight="600" fill="#17243a">Coding agent</text>
    <text x="60" y="316" font-size="15" fill="#63738a">Searches earlier sessions</text>
    <text x="60" y="337" font-size="15" fill="#63738a">and checks cited evidence</text>

    <rect x="414" y="187" width="302" height="196" rx="12" fill="#fff" stroke="#5069b0" stroke-width="1.6"/>
    <text x="438" y="220" font-size="21" font-weight="600" fill="#17243a">Session Search</text>
    <text x="438" y="248" font-size="15" fill="#63738a">search · context · status</text>
    <path d="M438 267 H692" stroke="#e2e8f0"/>
    <g transform="translate(438 290)" fill="none" stroke="#5069b0" stroke-width="1.6">
      <ellipse cx="15" cy="5" rx="14" ry="5"/><path d="M1 5 v28 c0 7 28 7 28 0 V5 M1 20 c0 7 28 7 28 0"/>
    </g>
    <text x="484" y="306" font-size="17" fill="#17243a">History + search index</text>
    <text x="484" y="330" font-size="14" fill="#63738a">SQLite · recorded revisions</text>
    <text x="438" y="362" font-size="13" fill="#63738a">Local process or authenticated primary service</text>

    <path d="M260 260 H405" fill="none" stroke="#5069b0" stroke-width="2" marker-end="url(#accent)"/>
    <text x="332" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#5069b0">Search via MCP</text>
    <path d="M405 310 H260" fill="none" stroke="#63738a" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="332" y="336" text-anchor="middle" font-size="13" fill="#63738a">Excerpts + citations</text>

    <!-- Sources are the origin of the evidence, on the far right. -->
    <rect x="856" y="128" width="224" height="159" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <g transform="translate(876 153)" fill="none" stroke="#63738a" stroke-width="1.6" stroke-linejoin="round">
      <rect width="26" height="19" rx="2"/><path d="M-3 24 h32"/>
      <rect x="40" width="26" height="19" rx="2"/><path d="M37 24 h32"/>
    </g>
    <text x="954" y="173" font-size="13" fill="#63738a">Shared mode</text>
    <text x="876" y="218" font-size="19" font-weight="600" fill="#17243a">Session sync</text>
    <text x="876" y="242" font-size="14" fill="#63738a">Codex sessions on each device</text>
    <text x="876" y="266" font-size="13" fill="#63738a">Per-device capture + upload queue</text>
    <path d="M848 228 H725" fill="none" stroke="#63738a" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="786" y="201" text-anchor="middle" font-size="13" fill="#63738a">Authenticated sync</text>
    <text x="786" y="218" text-anchor="middle" font-size="13" fill="#63738a">Retries after outages</text>

    <!-- Optional services extend the central engine. -->
    <rect x="414" y="467" width="302" height="114" rx="12" fill="#eef2fa" stroke="#cbd5e1"/>
    <text x="438" y="491" font-size="11" font-weight="700" letter-spacing="1" fill="#5069b0">OPTIONAL</text>
    <text x="438" y="518" font-size="19" font-weight="600" fill="#17243a">Remote embedding server</text>
    <text x="438" y="542" font-size="14" fill="#63738a">Evidence and query embeddings</text>
    <text x="438" y="562" font-size="13" fill="#63738a">A local model can serve the same role.</text>
    <path d="M565 391 V459" fill="none" stroke="#63738a" stroke-width="1.6" stroke-dasharray="5 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="582" y="429" font-size="13" fill="#63738a">Semantic search</text>

    <rect x="856" y="395" width="224" height="135" rx="12" fill="#eef2fa" stroke="#cbd5e1"/>
    <text x="876" y="421" font-size="11" font-weight="700" letter-spacing="1" fill="#5069b0">OPTIONAL</text>
    <text x="876" y="449" font-size="19" font-weight="600" fill="#17243a">Read-only replica</text>
    <text x="876" y="475" font-size="14" fill="#63738a">Evidence + compatible vectors</text>
    <text x="876" y="498" font-size="14" fill="#63738a">Search failover for MCP clients</text>
    <path d="M724 344 H789 Q799 344 799 354 V450 Q799 460 809 460 H848" fill="none" stroke="#63738a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="862" y="347" font-size="13" fill="#63738a">Verified replication</text>
    <text x="862" y="366" font-size="13" fill="#63738a">from the primary</text>

    <text x="40" y="545" font-size="13" fill="#63738a">Each device uploads to one primary.</text>
    <text x="40" y="565" font-size="13" fill="#63738a">Agents search the shared history.</text>
  </g>
</svg>
