[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "session-search"
version = "0.1.0.dev0"
description = "Past coding conversations for your AI agent, with cited evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
session-search = "session_search.interfaces.cli:main"

[tool.hatch.build.targets.wheel.force-include]
"docs/provenance.md" = "session_search/PROVENANCE.md"

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.34"]
mcp = ["mcp>=1.12,<2"]
embeddings = ["numpy>=1.26"]
local = ["llama-cpp-python>=0.3.35", "numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
