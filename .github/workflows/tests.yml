name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.7
      - name: Install Restic on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y restic
      - name: Install Restic on macOS
        if: runner.os == 'macOS'
        run: brew install restic
      - run: uv sync --locked --group dev --extra server --extra mcp --extra embeddings
      - name: Validate workflows
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate launchd templates
        if: runner.os == 'macOS'
        run: plutil -lint deploy/launchd/*.plist
      - run: uv run --no-sync ruff check src tests benchmarks
      - run: uv run --no-sync pytest -q
      - run: uv build
      - name: Check keyword retrieval regressions
        run: uv run --no-sync python benchmarks/evaluate_retrieval.py --data-dir "$RUNNER_TEMP/session-search-benchmark" --output "$RUNNER_TEMP/session-search-benchmark.json" --baseline benchmarks/keyword-baseline.json
      - name: Verify offline core wheel installation
        run: python tests/check_offline_wheel.py dist
      - name: Prepare pinned MCP dependency wheels
        run: |
          uv export --locked --no-dev --extra mcp --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/mcp-requirements.txt"
          python -m pip download --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/mcp-requirements.txt" --dest "$RUNNER_TEMP/mcp-wheelhouse"
      - name: Verify offline MCP installation and stdio operation
        run: python tests/check_offline_mcp.py dist "$RUNNER_TEMP/mcp-wheelhouse"
      - name: Retain retrieval report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retrieval-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/session-search-benchmark.json
          retention-days: 14
          if-no-files-found: warn
